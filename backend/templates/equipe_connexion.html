{% extends "base.html" %}

{% block title %}Prévial — Espace collaborateurs{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='previal-equipe.css') }}">

<div class="eq-fond">
  <div class="eq-page">
    <div class="eq-connexion">
      <div class="eq-tete">
        <div>
          <h1>Espace collaborateurs</h1>
          <p class="eq-sous-titre">Accès réservé aux membres de l'équipe Prévial.</p>
        </div>
      </div>

      <form method="POST" action="/equipe" class="eq-bloc">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if erreur %}
        <div role="alert" class="eq-message eq-message-erreur">{{ erreur }}</div>
        {% endif %}
        <div class="eq-champ">
          <label for="connexion-email">E-mail</label>
          <input id="connexion-email" type="email" name="email" autocomplete="username" required>
        </div>
        <div class="eq-champ">
          <label for="connexion-mdp">Mot de passe</label>
          <input id="connexion-mdp" type="password" name="mot_de_passe" autocomplete="current-password" required>
        </div>
        
        <button type="submit" class="eq-btn eq-btn-plein">Se connecter</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

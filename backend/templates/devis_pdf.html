<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  body{ font-family: Arial, sans-serif; color:#20242C; padding:40px; }
  .logo{ font-size:24px; font-weight:bold; color:#1C2B45; margin-bottom:30px; }
  h1{ color:#1C2B45; font-size:22px; }
  .prix{ font-size:32px; color:#1C2B45; margin:20px 0; }
  .info{ margin-bottom:8px; }
  .label{ color:#5B6270; font-size:12px; }
</style>
</head>
<body>
  <div class="logo">Prévial</div>
  <h1>Devis — {{ produit.nom }}</h1>
  <p class="info"><span class="label">Dossier n°</span> {{ dossier.id }}</p>
  <p class="info"><span class="label">Date</span> {{ date_du_jour }}</p>
  <div class="prix">{{ devis.montant }}€ / mois</div>
  <p class="info"><span class="label">Statut</span> Devis accepté</p>
</body>
</html>
